# Clock Köprüsü
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# LIDAR Köprüsü
- ros_topic_name: "/sim_lidar/pointcloud/points"
  gz_topic_name: "/sim_lidar/pointcloud/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# TF Köprüsü (İsimlendirme dönüşümü ve remapping burada yapılıyor)
- ros_topic_name: "/tf"
  gz_topic_name: "/model/iris_with_lidar/pose"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS
  frame_id: "map"

